<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="B-Roll-Bibliothek für das eigene NAS" />
    <title>FootageDB</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cstyle%3Erect%7Bstroke:%230a0a0a%7D path%7Bfill:%230a0a0a%7D%40media(prefers-color-scheme:dark)%7Brect%7Bstroke:%23fafafa%7D path%7Bfill:%23fafafa%7D%7D%3C/style%3E%3Crect x='3' y='6' width='12' height='12' rx='2' fill='none' stroke-width='2'/%3E%3Cpath d='M17 10.2l4-2.4v8.4l-4-2.4z'/%3E%3C/svg%3E"
    />
    <script>
      /* Das gespeicherte Thema noch vor dem ersten Bild setzen, sonst blitzt
         beim Laden kurz die falsche Oberfläche auf. */
      (function () {
        try {
          var stored = localStorage.getItem('fdb-theme')
          var dark =
            stored === 'dark' ||
            ((!stored || stored === 'system') &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
        } catch (error) {
          document.documentElement.dataset.theme = 'light'
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
