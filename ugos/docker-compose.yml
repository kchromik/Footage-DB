# FootageDB auf einem UGREEN NAS (UGOS Pro)
#
# Einsetzen über die Docker-App: Project -> Create Project -> diesen Inhalt
# einfügen. Vorher die drei mit ANPASSEN markierten Stellen prüfen.
#
# Ausführliche Anleitung: https://github.com/kchromik/Footage-DB#installation-auf-einem-ugreen-nas

services:
  footagedb:
    image: ghcr.io/kchromik/footage-db:latest
    container_name: footagedb
    restart: unless-stopped

    ports:
      # ANPASSEN, falls 8080 auf dem NAS schon belegt ist: linke Zahl ändern
      - "8080:8080"

    volumes:
      # ANPASSEN: links der echte Pfad deines Footage-Ordners auf dem NAS
      - /volume1/Footage:/media
      # Datenbank, Vorschaubilder und Previews. Wächst mit der Bibliothek,
      # rechne mit rund 5 Prozent der Größe deines Footage-Ordners.
      - /volume1/docker/footagedb:/data

    environment:
      # Schlüssel für die Anmelde-Cookies. Schon zufällig erzeugt, kann so
      # bleiben. Änderst du ihn, musst du dich einmal neu anmelden.
      FDB_SECRET_KEY: "18a3a114d4f78a1e03aacd0a10c8f908d4c035171f738fb2d078f871fb2566a1"

      # ANPASSEN, falls die Rechte nicht stimmen. Der Einrichtungsassistent
      # zeigt unter Systemprüfung an, wem dein Footage-Ordner gehört und als
      # wem der Container läuft. Weichen die Zahlen ab, hier eintragen und
      # den Container neu starten.
      PUID: "1000"
      PGID: "1000"

      TZ: "Europe/Berlin"
      FDB_AUTH_USER: "kevin"
      FDB_WORKER_COUNT: "2"
      FDB_SEMANTIC_ENABLED: "true"

    # Hardware-Encoding über die Intel-Grafikeinheit. Erst ohne starten, dann
    # diese zwei Zeilen einkommentieren und neu starten. Fährt der Container
    # danach nicht hoch, gibt es das Gerät nicht, dann wieder auskommentieren.
    # devices:
    #   - /dev/dri:/dev/dri
